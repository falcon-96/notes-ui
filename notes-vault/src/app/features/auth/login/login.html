<div class="card" style="width: 20rem">
  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="authForm">
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Email Address</label>
      <input
        type="email"
        class="form-control"
        id="exampleInputEmail1"
        aria-describedby="emailHelp"
        formControlName="username"
      />
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Password</label>
      <input
        type="password"
        class="form-control"
        id="exampleInputPassword1"
        formControlName="password"
      />
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="formGroup.invalid">Submit</button>
    <p class="extraFormFooterInfo">Don't have an account? <a routerLink="/register">Register</a></p>
  </form>
</div>
